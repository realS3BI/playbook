name: playbook-dev

services:
  mongodb:
    image: mongo:7
    volumes:
      - mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Source is mounted; tsc --watch compiles, node --watch restarts. New packages need a restart of ./dev.sh.
  api:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile.dev
    init: true
    command: ["sh", "-c", "./node_modules/.bin/tsc -p tsconfig.server.json --incremental; ./node_modules/.bin/tsc -p tsconfig.server.json --incremental --watch --preserveWatchOutput & exec node --watch build/src/server.js"]
    ports:
      - "127.0.0.1:${DEV_API_PORT:-8080}:8080"
    environment:
      NODE_ENV: development
      ADMIN_PANEL_PUBLIC_URL: ${ADMIN_PANEL_PUBLIC_URL:?}
      ADMIN_PANEL_SESSION_SECRET: ${ADMIN_PANEL_SESSION_SECRET:?}
      ADMIN_PANEL_ADMIN_STEAM_ID: ${ADMIN_PANEL_ADMIN_STEAM_ID:-}
      ADMIN_PANEL_TEST_USERNAME: ${ADMIN_PANEL_TEST_USERNAME:-test}
      ADMIN_PANEL_TEST_PASSWORD: ${ADMIN_PANEL_TEST_PASSWORD:-}
      UPLOADTHING_TOKEN: ${UPLOADTHING_TOKEN:-}
      RECORDING_STORAGE: ${RECORDING_STORAGE:-local}
      ANALYSIS_STORAGE_LIMIT_GIB: ${ANALYSIS_STORAGE_LIMIT_GIB:-100}
      ANALYSIS_SCOPE_LIMIT_GIB: ${ANALYSIS_SCOPE_LIMIT_GIB:-20}
      ANALYSIS_MINIMUM_FREE_GIB: ${ANALYSIS_MINIMUM_FREE_GIB:-2}
      FACEIT_API_KEY: ${FACEIT_API_KEY:-}
      FACEIT_DOWNLOADS_TOKEN: ${FACEIT_DOWNLOADS_TOKEN:-}
      STEAM_WEB_API_KEY: ${STEAM_WEB_API_KEY:-}
      # Use a separate Steam account locally, so development cannot replace the production session.
      STEAM_GC_REFRESH_TOKEN: ${DEV_STEAM_GC_REFRESH_TOKEN:-}
    volumes:
      - ./admin-panel/src:/app/src:ro
      - ./admin-panel/shared:/app/shared:ro
      - ./admin-panel/test:/app/test:ro
      - ./admin-panel/client:/app/client:ro
      - ./admin-panel/tsconfig.server.json:/app/tsconfig.server.json:ro
      - runtime:/runtime
      - uploads:/uploads
      - demos:/demos
      - cs2_data:/cs2-data
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 5s
      retries: 60

  demo-worker:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile.dev
    init: true
    restart: unless-stopped
    command: ["sh", "-c", "./node_modules/.bin/tsc -p tsconfig.worker.json --incremental; ./node_modules/.bin/tsc -p tsconfig.worker.json --incremental --watch --preserveWatchOutput & exec node --watch build/src/demo-worker-main.js"]
    environment:
      NODE_ENV: production
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./admin-panel/src:/app/src:ro
      - ./admin-panel/shared:/app/shared:ro
      - ./admin-panel/tsconfig.server.json:/app/tsconfig.server.json:ro
      - ./admin-panel/tsconfig.worker.json:/app/tsconfig.worker.json:ro
      - demos:/demos
    mem_limit: 4g
    cpus: 2
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /app/build:size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # Optional: docker compose --profile map-scenes up map-scenes. Needs CS2 game files under
  # MAP_SCENE_GAME_FILES (directory containing game/csgo); pnpm pull:prod also copies exported scenes.
  map-scenes:
    profiles: [map-scenes]
    build:
      context: .
      dockerfile: admin-panel/Dockerfile.map-scenes
    init: true
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ${MAP_SCENE_GAME_FILES:-cs2_data}:/cs2-data:ro
      - uploads:/uploads
    mem_limit: 12g
    cpus: 2
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop: [ALL]
    # The CS2 bootstrap rewrites gameinfo.gi with mode 600; read it without other privileges.
    cap_add: [DAC_READ_SEARCH]
    security_opt: [no-new-privileges:true]

volumes:
  mongodb:
  runtime:
  uploads:
  demos:
  cs2_data:
