name: playbook

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - admin_panel_mongodb:/data/db

  admin-panel:
    build:
      context: .
      dockerfile: admin-panel/Dockerfile
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_started
    expose:
      - "8080"
    environment:
      PLAYBOOK_COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-playbook}
      ADMIN_PANEL_PUBLIC_URL: ${ADMIN_PANEL_PUBLIC_URL:?ADMIN_PANEL_PUBLIC_URL is required}
      ADMIN_PANEL_ADMIN_STEAM_ID: ${ADMIN_PANEL_ADMIN_STEAM_ID:-}
      ADMIN_PANEL_SESSION_SECRET: ${ADMIN_PANEL_SESSION_SECRET:?ADMIN_PANEL_SESSION_SECRET is required}
      ADMIN_PANEL_TEST_USERNAME: ${ADMIN_PANEL_TEST_USERNAME:-test}
      ADMIN_PANEL_TEST_PASSWORD: ${ADMIN_PANEL_TEST_PASSWORD:-}
      UPLOADTHING_TOKEN: ${UPLOADTHING_TOKEN:-}
      RECORDING_STORAGE: ${RECORDING_STORAGE:-local}
      ANALYSIS_STORAGE_LIMIT_GIB: ${ANALYSIS_STORAGE_LIMIT_GIB:-100}
      ANALYSIS_SCOPE_LIMIT_GIB: ${ANALYSIS_SCOPE_LIMIT_GIB:-20}
      ANALYSIS_MINIMUM_FREE_GIB: ${ANALYSIS_MINIMUM_FREE_GIB:-2}
      FACEIT_API_KEY: ${FACEIT_API_KEY:-}
      FACEIT_DOWNLOADS_TOKEN: ${FACEIT_DOWNLOADS_TOKEN:-}
      STEAM_WEB_API_KEY: ${STEAM_WEB_API_KEY:-}
      STEAM_GC_REFRESH_TOKEN: ${STEAM_GC_REFRESH_TOKEN:-}
    volumes:
      - admin_panel_runtime:/runtime
      - admin_panel_uploads:/uploads
      - demo_data:/demos
      - cs2_data:/cs2-data
      - /var/run/docker.sock:/var/run/docker.sock

  demo-worker:
    build:
      context: .
      dockerfile: admin-panel/Dockerfile.demo-worker
    restart: unless-stopped
    init: true
    depends_on:
      mongodb:
        condition: service_started
    volumes:
      - demo_data:/demos
    mem_limit: 4g
    cpus: 2
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # Exports maps with lineups from the game files for the Abwurfsicht on lineup pages.
  map-scenes:
    build:
      context: .
      dockerfile: admin-panel/Dockerfile.map-scenes
    restart: unless-stopped
    init: true
    depends_on:
      mongodb:
        condition: service_started
    volumes:
      - cs2_data:/cs2-data:ro
      - admin_panel_uploads:/uploads
    mem_limit: 12g
    cpus: 2
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop: [ALL]
    # The CS2 bootstrap rewrites gameinfo.gi with mode 600; read it without other privileges.
    cap_add: [DAC_READ_SEARCH]
    security_opt: [no-new-privileges:true]

  cs2:
    build:
      context: .
      dockerfile: cs2/Dockerfile
    restart: unless-stopped
    ports:
      - "27015:27015/tcp"
      - "27015:27015/udp"
      - "27020:27020/udp"
    volumes:
      - cs2_data:/home/steam/cs2-dedicated
      - admin_panel_runtime:/config-runtime

volumes:
  admin_panel_mongodb:
  admin_panel_runtime:
  admin_panel_uploads:
  demo_data:
  cs2_data:
