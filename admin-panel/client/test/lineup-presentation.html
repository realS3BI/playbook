<!doctype html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offizielle Lineup-Präsentation prüfen</title></head><body><main id="root" style="max-width:1800px;margin:24px auto;padding:0 16px"></main><script type="module">
import React, {useState} from 'react';
import {createRoot} from 'react-dom/client';
import {MemoryRouter, Route, Routes} from 'react-router-dom';
import {NadeLibrary} from '/src/components/nade-library.tsx';

const canvas=document.createElement('canvas');canvas.width=960;canvas.height=540;
const ctx=canvas.getContext('2d');
function draw(){ctx.fillStyle='#263c43';ctx.fillRect(0,0,960,540);ctx.fillStyle='#b6a88d';ctx.fillRect(0,90,455,450);ctx.fillStyle='#dfcdb0';ctx.fillRect(455,120,300,420);ctx.fillStyle='#b07032';ctx.fillRect(470,360,490,90);ctx.strokeStyle='#78ff48';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(474,270);ctx.lineTo(486,270);ctx.moveTo(480,264);ctx.lineTo(480,276);ctx.stroke();}
draw();const photo=canvas.toDataURL('image/png');
const stream=canvas.captureStream(0), recorder=new MediaRecorder(stream,{mimeType:'video/webm'}), chunks=[];
recorder.ondataavailable=event=>chunks.push(event.data);
const stopped=new Promise(resolve=>recorder.onstop=resolve);
recorder.start();const frames=setInterval(()=>{draw();stream.getVideoTracks()[0].requestFrame();},75);await new Promise(resolve=>setTimeout(resolve,800));recorder.stop();await stopped;clearInterval(frames);stream.getTracks().forEach(track=>track.stop());
const video=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));
// Supply a real, decoded clip for hover playback without a running API server.
new MutationObserver(()=>{for(const player of document.querySelectorAll('.radar-preview-video video'))if(player.getAttribute('src')?.startsWith('/api/nades/video-preview/'))player.src=video;}).observe(document.body,{childList:true,subtree:true});
const reviewMedia={video:{key:'demo-video',url:video},...Object.fromEntries(['aim','position','front','effect'].map(slot=>[slot,{key:slot,url:photo}]))};
const owner='76561198000000001',user={identitySteam64:owner,role:'admin'};
let entries=[{id:'Demo123',owner,map:'de_mirage',name:'window',displayName:'Fenster vom T-Spawn',type:'Smoke',team:'t',official:true,mustKnow:true,reviewStatus:'approved',updatedAt:'2026-10-03T12:00:00.000Z',reviewMedia,throwFromTitle:'T-Spawn',throwToTitle:'Fenster',desc:'An der Kante stehen. Auf die obere Ecke der Wand zielen und die Smoke im Sprung werfen.',radarFrom:{x:.25,y:.75},radarTo:{x:.55,y:.2},lineupPos:'1 2 3',lineupAng:'0 90 0',flightDuration:3.125,is_jumpthrow:true,is_crouch:false,is_walking:false,is_running:false,is_stepping:false,click_type:'left'}];
window.fetch=async()=>new Response(JSON.stringify({entries:[]}),{headers:{'Content-Type':'application/json'}});
const overview=new URLSearchParams(location.search).has('overview');
function App(){const [nades,setNades]=useState(entries);window.setRecording=patch=>{entries=entries.map(entry=>({...entry,...patch}));setNades(entries);};window.setEntries=next=>{entries=next;setNades(next);};return React.createElement(MemoryRouter,{initialEntries:[overview?'/maps/mirage':'/maps/mirage/lineups/Demo123']},React.createElement(NadeFavoritesProvider,null,React.createElement(Routes,null,React.createElement(Route,{path:'/maps/:mapSlug',element:React.createElement(NadeLibrary,{maps:ACTIVE_DUTY_MAPS,nades,user})}),React.createElement(Route,{path:'/maps/:mapSlug/lineups/:lineupId',element:React.createElement(LineupPage,{maps:ACTIVE_DUTY_MAPS,nades,user,onEntriesChange:setNades,onRefresh:async()=>{}})}))));}
createRoot(document.getElementById('root')).render(React.createElement(App));
const waitFor=async (fn,attempts=120)=>{for(let i=0;i<attempts;i++){if(fn())return;await new Promise(resolve=>setTimeout(resolve,25));}throw Error('Zeitüberschreitung: '+document.body.innerText);};
const assert=(value,message)=>{if(!value)throw Error(message);};
const button=text=>[...document.querySelectorAll('button')].find(button=>{const copy=button.cloneNode(true);copy.querySelector('[data-slot="kbd-group"]')?.remove();return copy.textContent.trim()===text;});
const shift=type=>window.dispatchEvent(new KeyboardEvent(type,{key:'Shift',bubbles:true}));
const alt=type=>window.dispatchEvent(new KeyboardEvent(type,{key:'Alt',bubbles:true,cancelable:true}));
window.checkDetail=async()=>{
 await waitFor(()=>document.querySelector('.lineup-hero-video')?.readyState>=2);
 const video=document.querySelector('.lineup-hero-video');
 assert(!video.hidden,'Video nicht im Vordergrund');
 assert([...document.querySelectorAll('.official-photo-picker button')].map(item=>item.querySelector(':scope > span').textContent).join(',')==='Video,Ausrichtung,Standposition,Wirkung am Ziel,Vorderansicht,Abwurfsicht','Medienauswahl oder Reihenfolge falsch');
 assert(!document.querySelector('.official-view-switch'),'Alter Toggle noch sichtbar');
 assert(!!document.querySelector('.official-lineup-sidebar .official-lineup-actions'),'Aktionen fehlen rechts');
 assert(!document.querySelector('.official-lineup-instructions').textContent.includes('Shift'),'Shift-Hinweis steht in der Anleitung');
 assert(video.autoplay&&video.loop&&!video.controls,'Autostart, Loop oder ausgeblendete Playbar fehlen');
 await waitFor(()=>!video.paused);
 window.dispatchEvent(new KeyboardEvent('keydown',{key:'k',bubbles:true,cancelable:true}));await waitFor(()=>video.paused&&document.querySelector('.lineup-video-paused'));
 assert(document.querySelector('.lineup-video-toggle').getAttribute('aria-label')==='Video abspielen','Mittiger Play-Button fehlt');
 document.querySelector('.lineup-video-toggle').click();await waitFor(()=>!video.paused&&!document.querySelector('.lineup-video-paused'));
 document.querySelector('.lineup-video-toggle').click();await waitFor(()=>video.paused);
 window.dispatchEvent(new KeyboardEvent('keydown',{key:'k',bubbles:true,cancelable:true}));await waitFor(()=>!video.paused);
 let lastTime=video.currentTime,looped=false;
 await waitFor(()=>{const time=video.currentTime;if(time<lastTime)looped=true;lastTime=time;return looped;});
 shift('keydown');await waitFor(()=>document.querySelector('.official-photo-viewport img')?.style.transform==='scale(3)');
 assert(video.hidden&&video.paused,'Video läuft hinter der Shift-Ansicht weiter');
 alt('keydown');await waitFor(()=>document.querySelector('.official-lineup-photo figcaption')?.textContent==='Wirkung am Ziel');
 assert(!document.querySelector('.official-photo-viewport img').style.transform,'Wirkung wird ungewollt gezoomt');
 shift('keyup');await waitFor(()=>document.querySelector('.official-lineup-photo figcaption')?.textContent==='Standposition');
 shift('keydown');await waitFor(()=>document.querySelector('.official-lineup-photo figcaption')?.textContent==='Wirkung am Ziel');
 alt('keyup');await waitFor(()=>document.querySelector('.official-lineup-photo figcaption')?.textContent.includes('Fadenkreuz-Zoom'));
 shift('keyup');await waitFor(()=>!video.hidden&&!video.paused);
 alt('keydown');await waitFor(()=>document.querySelector('.official-lineup-photo figcaption')?.textContent==='Standposition');
 alt('keyup');await waitFor(()=>!video.hidden&&!video.paused);
 button('Vorderansicht').click();await waitFor(()=>document.querySelector('.official-lineup-photo figcaption')?.textContent==='Vorderansicht');
 button('Wirkung am Ziel').click();await waitFor(()=>document.querySelector('.official-lineup-photo figcaption')?.textContent==='Wirkung am Ziel');
 button('Standposition').click();await waitFor(()=>document.querySelector('.official-lineup-photo figcaption')?.textContent==='Standposition');
 shift('keydown');await waitFor(()=>document.querySelector('.official-lineup-photo figcaption')?.textContent.includes('Fadenkreuz-Zoom'));
 shift('keyup');await waitFor(()=>document.querySelector('.official-lineup-photo figcaption')?.textContent==='Standposition');
 button('Ausrichtung').click();await waitFor(()=>button('Fadenkreuz-Zoom'));
 assert(!document.querySelector('.lineup-guide'),'Lineup-Hilfe standardmäßig an');
 button('Lineup-Hilfe').click();
 const tickLabel=()=>[...document.querySelectorAll('.official-media-stage .lineup-guide-labels text')].find(text=>text.textContent==='1y');
 await waitFor(()=>tickLabel());
 assert(button('Lineup-Hilfe').getAttribute('aria-pressed')==='true'&&localStorage.getItem('playbook.lineupGuide')==='on','Lineup-Hilfe nicht aktiv oder nicht gespeichert');
 const centre=document.querySelector('.official-media-stage').clientHeight*devicePixelRatio/2,tickDistance=()=>centre-Number(tickLabel().getAttribute('y'));
 const distance=tickDistance();
 assert(distance>0&&['3y','2y','1y','-1y','-1x','1x','5x'].every(value=>[...document.querySelectorAll('.lineup-guide-labels text')].some(text=>text.textContent===value)),'Markierungen der Lineup-Hilfe fehlen');
 shift('keydown');await waitFor(()=>Math.abs(tickDistance()/distance-3)<0.02);
 shift('keyup');await waitFor(()=>Math.abs(tickDistance()-distance)<1);
 button('Lineup-Hilfe').click();await waitFor(()=>!document.querySelector('.lineup-guide'));
 button('Fadenkreuz-Zoom').click();await waitFor(()=>document.querySelector('.crosshair-viewport img'));
 assert(document.querySelector('.crosshair-viewport img').style.transform==='scale(3)','Dialogzoom fehlt');
 button('Ganzes Bild').click();await waitFor(()=>document.querySelector('.crosshair-viewport img').style.transform==='scale(1)');
 document.querySelector('button:has(.sr-only)').click();await waitFor(()=>!document.querySelector('.crosshair-viewport'));
 assert(document.documentElement.scrollWidth<=innerWidth,'Horizontaler Überlauf');
 window.setRecording({official:false,mustKnow:false});await waitFor(()=>!document.querySelector('.lineup-hero-video'));
 assert([...document.querySelectorAll('.official-photo-picker button')].map(item=>item.querySelector(':scope > span').textContent).join(',')==='Abwurfsicht','Entwurf zeigt Review-Medien');
 assert(document.querySelector('.official-photo-picker button').getAttribute('aria-pressed')==='true','Abwurfsicht im Entwurf nicht ausgewählt');
 assert(!!document.querySelector('.official-lineup-sidebar .official-throw-facts')&&!document.body.innerText.includes('Offiziell'),'Entwurf nutzt nicht die gemeinsame Seitenleiste');
 alt('keydown');await new Promise(resolve=>setTimeout(resolve,100));
 assert(!document.querySelector('.official-lineup-photo'),'Tastenkürzel öffnet Review-Medien im Entwurf');
 alt('keyup');
 window.setRecording({official:true,mustKnow:true});await waitFor(()=>document.querySelectorAll('.official-photo-picker button').length===6);
 return 'PASS: Video, Pausieren und Fortsetzen, Shift/Alt/Shift+Alt, Bildauswahl, Lineup-Hilfe, Zoomdialog, Entwurfsansicht und Layout';
};
window.checkRadarPreview=async(mode='to')=>{
 await waitFor(()=>document.querySelector('.radar-spot'));
 if(mode==='from'){button('Starts').click();await waitFor(()=>document.querySelector('.radar-spot-from'));}
 const secondary=mode==='from'?'.radar-spot:not(.radar-spot-from)':'.radar-spot-from';
 document.querySelector('.radar-spot').click();await waitFor(()=>document.querySelector(secondary));
 const marker=document.querySelector(secondary);
 assert(!document.querySelector('.radar-spot[title]'),'Marker zeigt einen Tooltip');
 marker.dispatchEvent(new MouseEvent('mouseover',{bubbles:true,relatedTarget:document.body}));await waitFor(()=>document.querySelector('.radar-preview-media'));
 assert(!document.querySelector('.radar-preview strong')&&!document.querySelector('.radar-preview button'),'Vorschau enthält Namen oder Zusatzbuttons');
 assert(!document.querySelector('.radar-preview-heading'),'Hinweiszeile ist noch sichtbar');
 await waitFor(()=>document.querySelector('.radar-preview-video video')?.readyState>=2);
 const previewVideo=document.querySelector('.radar-preview-video video');
 window.setRecording({desc:'Aktualisierte Anleitung während der Wiedergabe'});
 await new Promise(resolve=>setTimeout(resolve,200));
 assert(previewVideo.isConnected&&document.querySelector('.radar-preview-video video')===previewVideo,'Datenaktualisierung schließt die laufende Vorschau');
 assert(previewVideo.autoplay&&previewVideo.loop&&!previewVideo.controls,'Vorschau startet oder wiederholt nicht automatisch');
 await waitFor(()=>!previewVideo.paused);
 let lastPreviewTime=previewVideo.currentTime,previewLoops=0;
 await waitFor(()=>{const time=previewVideo.currentTime;if(time<lastPreviewTime)previewLoops++;lastPreviewTime=time;return previewLoops>=3;},240);
 previewVideo.pause();await waitFor(()=>!previewVideo.paused);
 previewVideo.dispatchEvent(new Event('ended'));await waitFor(()=>!previewVideo.paused&&previewVideo.currentTime<.15);
 previewVideo.dispatchEvent(new Event('error'));await waitFor(()=>previewVideo.getAttribute('src')===reviewMedia.video.url&&previewVideo.readyState>=2&&!previewVideo.paused);
 previewVideo.currentTime=Math.min(.4,previewVideo.duration/2);
 shift('keydown');await waitFor(()=>document.querySelector('.radar-preview-photo img')?.alt.startsWith('Ausrichtung'));
 assert(previewVideo.paused,'Vorschau läuft hinter dem Bild weiter');
 alt('keydown');await waitFor(()=>document.querySelector('.radar-preview-photo img')?.alt.startsWith('Wirkung am Ziel'));
 assert(!document.querySelector('.radar-preview-photo-zoom'),'Wirkung wird gezoomt');
 shift('keyup');await waitFor(()=>document.querySelector('.radar-preview-photo img')?.alt.startsWith('Standposition'));
 alt('keyup');await waitFor(()=>!document.querySelector('.radar-preview-photo'));
 assert(previewVideo.currentTime<.15&&!previewVideo.paused,'Vorschau startet nach Shift+Alt nicht von vorne');
 previewVideo.currentTime=Math.min(.4,previewVideo.duration/2);
 alt('keydown');await waitFor(()=>document.querySelector('.radar-preview-photo img')?.alt.startsWith('Standposition'));
 alt('keyup');await waitFor(()=>!document.querySelector('.radar-preview-photo'));
 assert(previewVideo.currentTime<.15&&!previewVideo.paused,'Vorschau startet nach Alt nicht von vorne');
 previewVideo.currentTime=Math.min(.4,previewVideo.duration/2);

 shift('keyup');await waitFor(()=>!document.querySelector('.radar-preview-photo'));
 assert(previewVideo.currentTime<.15&&!previewVideo.paused,'Vorschau startet nach Shift nicht von vorne');
 marker.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true,shiftKey:true}));await waitFor(()=>document.querySelector('.crosshair-viewport'));

 assert(document.querySelector(secondary),'Kartenauswahl geht beim Schließen verloren');
